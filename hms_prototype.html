<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System - Dashboard Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar-item-active {
            background-color: #2b6cb0;
            color: #ffffff;
            border-left: 4px solid #63b3ed;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0">
            <div>
                <!-- App Logo -->
                <div class="h-16 flex items-center px-6 bg-slate-950 font-bold text-xl text-white tracking-wide border-b border-slate-800">
                    <i class="fa-solid font-bold text-blue-500 fa-hospital-user mr-3"></i> MediCore HMS
                </div>
                
                <!-- Role Selector Switcher -->
                <div class="p-4">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">Role Switcher</label>
                    <select id="roleSelect" onchange="switchRole(this.value)" class="w-full bg-slate-800 text-white text-sm rounded-lg p-2.5 border border-slate-700 focus:outline-none focus:border-blue-500">
                        <option value="admin">System Admin</option>
                        <option value="doctor">Doctor Dashboard</option>
                        <option value="patient">Patient Portal</option>
                    </select>
                </div>

                <!-- Navigation Links -->
                <nav class="mt-2 space-y-1" id="navLinks">
                    <!-- Links dynamically populated via JS -->
                </nav>
            </div>

            <!-- User Profile Section -->
            <div class="p-4 border-t border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white text-sm">
                        YA
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-white leading-tight">Rohan</p>
                        <p class="text-xs text-slate-400" id="currentRoleLabel">System Admin</p>
                    </div>
                </div>
                <button title="Logout" class="text-slate-400 hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- Top Header -->
            <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8 sticky top-0 z-10">
                <div class="flex items-center space-x-4">
                    <h1 class="text-xl font-bold text-gray-800" id="pageTitle">Admin Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <input type="text" placeholder="Search patients, doctors..." class="bg-gray-100 text-sm rounded-full pl-9 pr-4 py-2 w-64 border border-transparent focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                    </div>
                    <button class="relative text-gray-600 hover:text-blue-600 p-2 rounded-full hover:bg-gray-100">
                        <i class="fa-regular fa-bell text-lg"></i>
                        <span class="absolute top-1 right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">3</span>
                    </button>
                </div>
            </header>

            <!-- Dashboard Body -->
            <main class="p-8 space-y-6" id="dashboardContent">
                <!-- Content dynamically populated via JS -->
            </main>
        </div>
    </div>

    <!-- Modals Structure -->
    <div id="bookingModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Book New Appointment</h3>
            <form onsubmit="event.preventDefault(); closeModal();" class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase block mb-1">Select Specialization</label>
                    <select class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option>Cardiology</option>
                        <option>Neurology</option>
                        <option>Orthopedics</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase block mb-1">Select Doctor</label>
                    <select class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option>Dr. Sarah Jenkins (Cardiologist)</option>
                        <option>Dr. Robert Chen (Neurologist)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase block mb-1">Date & Time Slot</label>
                    <input type="datetime-local" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase block mb-1">Symptoms / Notes</label>
                    <textarea class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" rows="3" placeholder="Describe symptoms..."></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const views = {
            admin: {
                title: "System Admin Overview",
                nav: [
                    { name: "Dashboard", icon: "fa-chart-pie", active: true },
                    { name: "Doctor Management", icon: "fa-user-doctor", active: false },
                    { name: "Patient Records", icon: "fa-hospital-user", active: false },
                    { name: "Billing & Invoices", icon: "fa-file-invoice-dollar", active: false },
                    { name: "System Settings", icon: "fa-gear", active: false }
                ],
                content: `
                    <!-- Metric Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-4">
                            <div class="p-3 bg-blue-100 text-blue-600 rounded-lg"><i class="fa-solid fa-users text-2xl"></i></div>
                            <div>
                                <p class="text-xs text-gray-500 font-semibold uppercase">Total Patients</p>
                                <p class="text-2xl font-bold text-gray-800">1,284</p>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-4">
                            <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><i class="fa-solid fa-user-doctor text-2xl"></i></div>
                            <div>
                                <p class="text-xs text-gray-500 font-semibold uppercase">Active Doctors</p>
                                <p class="text-2xl font-bold text-gray-800">42</p>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-4">
                            <div class="p-3 bg-purple-100 text-purple-600 rounded-lg"><i class="fa-solid fa-calendar-check text-2xl"></i></div>
                            <div>
                                <p class="text-xs text-gray-500 font-semibold uppercase">Today's Visits</p>
                                <p class="text-2xl font-bold text-gray-800">156</p>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-4">
                            <div class="p-3 bg-amber-100 text-amber-600 rounded-lg"><i class="fa-solid fa-dollar-sign text-2xl"></i></div>
                            <div>
                                <p class="text-xs text-gray-500 font-semibold uppercase">Revenue (Sep)</p>
                                <p class="text-2xl font-bold text-gray-800">$48,250</p>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Appointments Table -->
                    <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
                        <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                            <h2 class="font-bold text-gray-800">Recent Hospital Activity</h2>
                            <button class="text-sm text-blue-600 font-semibold hover:underline">View All</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-gray-600">
                                <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
                                    <tr>
                                        <th class="p-4">Patient Name</th>
                                        <th class="p-4">Assigned Doctor</th>
                                        <th class="p-4">Department</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    <tr>
                                        <td class="p-4 font-semibold text-gray-800">John Doe</td>
                                        <td class="p-4">Dr. Sarah Jenkins</td>
                                        <td class="p-4">Cardiology</td>
                                        <td class="p-4"><span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-semibold">Completed</span></td>
                                        <td class="p-4"><button class="text-blue-600 hover:underline">Details</button></td>
                                    </tr>
                                    <tr>
                                        <td class="p-4 font-semibold text-gray-800">Alice Smith</td>
                                        <td class="p-4">Dr. Robert Chen</td>
                                        <td class="p-4">Neurology</td>
                                        <td class="p-4"><span class="bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full text-xs font-semibold">Scheduled</span></td>
                                        <td class="p-4"><button class="text-blue-600 hover:underline">Details</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `
            },
            doctor: {
                title: "Doctor Console - Dr. Sarah Jenkins",
                nav: [
                    { name: "My Schedule", icon: "fa-calendar-days", active: true },
                    { name: "Patient Appointments", icon: "fa-clipboard-user", active: false },
                    { name: "EHR & Prescriptions", icon: "fa-prescription-bottle-medical", active: false }
                ],
                content: `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                            <h2 class="font-bold text-gray-800 mb-4">Today's Patient Queue</h2>
                            <div class="space-y-3">
                                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-100">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 bg-blue-100 text-blue-600 font-bold rounded-full flex items-center justify-center">JD</div>
                                        <div>
                                            <p class="font-bold text-gray-800">John Doe (34M)</p>
                                            <p class="text-xs text-gray-500">Slot: 10:00 AM • Routine Consultation</p>
                                        </div>
                                    </div>
                                    <button class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-700">Write Prescription</button>
                                </div>
                                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-100">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 bg-purple-100 text-purple-600 font-bold rounded-full flex items-center justify-center">AS</div>
                                        <div>
                                            <p class="font-bold text-gray-800">Alice Smith (28F)</p>
                                            <p class="text-xs text-gray-500">Slot: 11:30 AM • ECG Follow-up</p>
                                        </div>
                                    </div>
                                    <button class="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-300">View History</button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-4">
                            <h2 class="font-bold text-gray-800">Quick Prescription Builder</h2>
                            <div>
                                <label class="text-xs font-semibold text-gray-500 uppercase">Patient ID/Name</label>
                                <input type="text" value="John Doe" class="w-full border rounded-lg p-2 text-sm mt-1 bg-gray-50">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-500 uppercase">Medication Name</label>
                                <input type="text" placeholder="e.g. Amoxicillin 500mg" class="w-full border rounded-lg p-2 text-sm mt-1">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-500 uppercase">Dosage Instruction</label>
                                <input type="text" placeholder="1 tablet twice daily after meals" class="w-full border rounded-lg p-2 text-sm mt-1">
                            </div>
                            <button class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold text-sm hover:bg-emerald-700">Save & Issue Prescription</button>
                        </div>
                    </div>
                `
            },
            patient: {
                title: "Patient Dashboard",
                nav: [
                    { name: "My Health Portal", icon: "fa-heart-pulse", active: true },
                    { name: "Appointments", icon: "fa-calendar-check", active: false },
                    { name: "Prescriptions", icon: "fa-pills", active: false },
                    { name: "Invoices", icon: "fa-receipt", active: false }
                ],
                content: `
                    <div class="flex justify-between items-center bg-blue-50 border border-blue-200 p-6 rounded-xl">
                        <div>
                            <h2 class="text-lg font-bold text-blue-900">Need to see a Doctor?</h2>
                            <p class="text-sm text-blue-700">Check availability and book instant appointments with specialists.</p>
                        </div>
                        <button onclick="openModal()" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-semibold shadow hover:bg-blue-700">Book Appointment</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                            <h3 class="font-bold text-gray-800 mb-3">Upcoming Appointments</h3>
                            <div class="border border-emerald-200 bg-emerald-50 rounded-lg p-4 flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-emerald-900">Dr. Sarah Jenkins</p>
                                    <p class="text-xs text-emerald-700">Cardiology • Tomorrow at 10:00 AM</p>
                                </div>
                                <span class="bg-emerald-200 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold">Confirmed</span>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                            <h3 class="font-bold text-gray-800 mb-3">Recent Prescriptions</h3>
                            <div class="border border-gray-200 rounded-lg p-4 flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-gray-800">Lipitor 20mg</p>
                                    <p class="text-xs text-gray-500">Issued by Dr. Sarah Jenkins on Sep 02, 2026</p>
                                </div>
                                <button class="text-blue-600 text-sm font-semibold hover:underline">Download PDF</button>
                            </div>
                        </div>
                    </div>
                `
            }
        };

        function switchRole(role) {
            const data = views[role];
            document.getElementById('pageTitle').innerText = data.title;
            document.getElementById('currentRoleLabel').innerText = role.charAt(0).toUpperCase() + role.slice(1);
            
            // Populate Nav
            const navContainer = document.getElementById('navLinks');
            navContainer.innerHTML = data.nav.map(item => `
                <a href="#" class="flex items-center px-6 py-3 text-sm font-medium ${item.active ? 'sidebar-item-active' : 'text-slate-400 hover:text-white hover:bg-slate-800'} transition-all">
                    <i class="fa-solid ${item.icon} w-6"></i> ${item.name}
                </a>
            `).join('');

            // Populate Content
            document.getElementById('dashboardContent').innerHTML = data.content;
        }

        function openModal() {
            document.getElementById('bookingModal').classList.remove('hidden');
            document.getElementById('bookingModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('bookingModal').classList.add('hidden');
            document.getElementById('bookingModal').classList.remove('flex');
        }

        // Initialize default view
        switchRole('admin');
    </script>
</body>
</html>
